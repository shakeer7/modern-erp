<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var k = "uniPiperTheme";
          var s = localStorage.getItem(k);
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>Register — UNiPiper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="page">
      <header>
        <a class="logo" href="index.html">UN<span>i</span>Piper</a>
        <nav class="nav-actions" aria-label="Account">
          <button type="button" class="theme-toggle" id="theme-toggle">
            <span class="theme-toggle-icon" aria-hidden="true">&#9728;</span>
          </button>
          <a class="btn btn-ghost" href="login.html">Log in</a>
        </nav>
      </header>

      <div class="auth-wrap">
        <div class="auth-card">
          <h2>Create account</h2>
          <p class="sub">Join UNiPiper in a few steps.</p>
          <p class="auth-error" id="auth-error" hidden></p>
          <p class="auth-success" id="auth-success" style="color: #10b981; font-size: 14px; margin-bottom: 1rem;" hidden></p>
          <form id="register-form" action="#" method="post">
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
            </div>
            <button class="btn btn-primary btn-block" type="submit">Register</button>
          </form>
          <p class="auth-footer">
            Already have an account? <a href="login.html">Log in</a>
          </p>
        </div>
      </div>

      <footer>&copy; UNiPiper</footer>
    </div>
    <script>
      (function () {
        document.getElementById("register-form").addEventListener("submit", async function (e) {
          e.preventDefault();
          var name = document.getElementById("name").value.trim();
          var email = document.getElementById("email").value.trim();
          var pass = document.getElementById("password").value;
          var err = document.getElementById("auth-error");
          var succ = document.getElementById("auth-success");
          err.hidden = true;
          succ.hidden = true;

          try {
            const response = await fetch('/api/auth/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: name, email: email, password: pass })
            });

            if (response.ok) {
              succ.textContent = "Registration successful! Redirecting to login...";
              succ.hidden = false;
              setTimeout(() => {
                window.location.href = "login.html";
              }, 1500);
            } else {
              const errorData = await response.json();
              err.textContent = errorData.detail || "Registration failed.";
              err.hidden = false;
            }
          } catch (error) {
             err.textContent = "Network error. Please try again later.";
             err.hidden = false;
          }
        });
      })();
    </script>
    <script src="theme.js" defer></script>
  </body>
</html>
