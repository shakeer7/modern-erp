<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var k = "uniPiperTheme";
          var s = localStorage.getItem(k);
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>Sign in — UNiPiper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="page">
      <header>
        <a class="logo" href="index.html">UN<span>i</span>Piper</a>
        <nav class="nav-actions" aria-label="Account">
          <button type="button" class="theme-toggle" id="theme-toggle">
            <span class="theme-toggle-icon" aria-hidden="true">&#9728;</span>
          </button>
          <a class="btn btn-primary" href="register.html">Register</a>
        </nav>
      </header>

      <div class="auth-wrap">
        <div class="auth-card">
          <h2>Sign in</h2>
          <p class="sub" id="sign-in-sub">Enter your email and password to open the student ERP.</p>
          <p class="auth-error" id="auth-error" hidden>Invalid email or password.</p>
          <form id="sign-in-form" action="#" method="post">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <button class="btn btn-primary btn-block" type="submit">Log in &amp; open ERP</button>
          </form>
          <p class="auth-footer">
            No account? <a href="register.html">Register</a>
          </p>
        </div>
      </div>

      <footer>&copy; UNiPiper</footer>
    </div>
    <script>
      (function () {
        document.getElementById("sign-in-form").addEventListener("submit", async function (e) {
          e.preventDefault();
          var email = document.getElementById("email").value.trim();
          var pass = document.getElementById("password").value;
          var err = document.getElementById("auth-error");
          err.hidden = true;

          try {
            const response = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: email, password: pass })
            });

            if (response.ok) {
              const data = await response.json();
              sessionStorage.setItem("uniPiperToken", data.access_token);
              window.location.href = "erp.html";
            } else {
              const errorData = await response.json();
              err.textContent = errorData.detail || "Login failed.";
              err.hidden = false;
            }
          } catch (error) {
             err.textContent = "Network error. Please try again later.";
             err.hidden = false;
          }
        });
      })();
    </script>
    <script src="theme.js" defer></script>
  </body>
</html>
