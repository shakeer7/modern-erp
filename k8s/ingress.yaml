apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: college-app-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: unipiper.local
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8000
      - path: /api/clubs
        pathType: Prefix
        backend:
          service:
            name: club-service
            port:
              number: 8000
      - path: /api/alumni
        pathType: Prefix
        backend:
          service:
            name: alumni-service
            port:
              number: 8000
      - path: /api/market
        pathType: Prefix
        backend:
          service:
            name: market-service
            port:
              number: 8000
      - path: /api/courses
        pathType: Prefix
        backend:
          service:
            name: course-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
