apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment-COLOR_PLACEHOLDER
  labels:
    app: frontend
    color: COLOR_PLACEHOLDER
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      color: COLOR_PLACEHOLDER
  template:
    metadata:
      labels:
        app: frontend
        color: COLOR_PLACEHOLDER
    spec:
      containers:
      - name: frontend-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
