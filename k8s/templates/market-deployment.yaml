apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service-deployment-COLOR_PLACEHOLDER
  labels:
    app: market-service
    color: COLOR_PLACEHOLDER
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-service
      color: COLOR_PLACEHOLDER
  template:
    metadata:
      labels:
        app: market-service
        color: COLOR_PLACEHOLDER
    spec:
      containers:
      - name: market-service
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "mysql+pymysql://root:collegepassword@mysql-service:3306/unipiper"
        - name: AWS_S3_BUCKET_NAME
          value: "college-app-market-images-610714125174"
