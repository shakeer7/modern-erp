apiVersion: apps/v1
kind: Deployment
metadata:
  name: alumni-service-deployment-COLOR_PLACEHOLDER
  labels:
    app: alumni-service
    color: COLOR_PLACEHOLDER
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alumni-service
      color: COLOR_PLACEHOLDER
  template:
    metadata:
      labels:
        app: alumni-service
        color: COLOR_PLACEHOLDER
    spec:
      containers:
      - name: alumni-service
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "mysql+pymysql://root:collegepassword@mysql-service:3306/unipiper"
